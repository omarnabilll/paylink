name: Phase 1 checks

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phase1-checks:
    name: Phase 1 checks
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Check the code
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand
